<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#030407">
<title>How AI Smart Are You? | Breakout AI Solutions</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root{
  --black:#030407;--navy:#07111f;--panel:#0b1424;--cyan:#27d8ff;--cyan2:#6ee7ff;
  --blue:#2776ff;--orange:#ff791f;--green:#22c55e;--red:#ef1c25;--text:#f4f8ff;
  --muted:#9eb1ca;--dim:#637994;--border:rgba(255,255,255,.10)
}
*{box-sizing:border-box}
html{background:var(--black);scroll-behavior:smooth}
body{
  margin:0;min-height:100vh;font-family:"DM Sans",sans-serif;color:var(--text);
  background:
    radial-gradient(circle at 50% -10%,rgba(39,216,255,.20),transparent 38%),
    radial-gradient(circle at 5% 40%,rgba(239,28,37,.08),transparent 24%),
    radial-gradient(circle at 95% 25%,rgba(255,121,31,.08),transparent 24%),
    linear-gradient(180deg,#030407,#06101d);
  overflow-x:hidden
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;
  background-image:
    linear-gradient(rgba(39,216,255,.032) 1px,transparent 1px),
    linear-gradient(90deg,rgba(39,216,255,.032) 1px,transparent 1px);
  background-size:48px 48px;
  mask-image:linear-gradient(#000,transparent 88%)
}
button,input{font:inherit}
button{-webkit-tap-highlight-color:transparent}
.app{position:relative;z-index:1;min-height:100vh}
.topbar{
  width:min(1120px,calc(100% - 28px));margin:auto;padding:18px 0 14px;
  display:flex;justify-content:space-between;align-items:center;gap:16px
}
.brand{display:flex;align-items:center;gap:12px}
.logo{
  width:46px;height:46px;border-radius:50%;display:grid;place-items:center;
  font-family:"Syne",sans-serif;font-weight:800;font-size:15px;color:var(--cyan2);
  border:1px solid rgba(39,216,255,.42);
  background:radial-gradient(circle at 32% 28%,rgba(39,216,255,.26),rgba(7,17,31,.96));
  box-shadow:0 0 28px rgba(39,216,255,.2)
}
.brand-name{font-family:"Syne",sans-serif;font-size:16px;font-weight:800}
.brand-sub{font-size:10px;color:var(--cyan2);letter-spacing:1.9px;text-transform:uppercase;font-weight:700;margin-top:2px}
.round-pill{
  padding:8px 12px;border-radius:999px;border:1px solid rgba(39,216,255,.25);
  background:rgba(39,216,255,.075);color:var(--cyan2);font-size:11px;font-weight:800;
  letter-spacing:1.2px;text-transform:uppercase
}
main{width:min(1040px,calc(100% - 20px));margin:auto;padding:12px 0 44px}
.shell{
  overflow:hidden;border:1px solid rgba(255,255,255,.11);border-radius:30px;
  background:linear-gradient(145deg,rgba(255,255,255,.075),rgba(255,255,255,.018)),rgba(7,17,31,.88);
  backdrop-filter:blur(22px);box-shadow:0 28px 80px rgba(0,0,0,.42)
}
.progress{height:5px;background:rgba(255,255,255,.06)}
.progress span{
  display:block;width:16.666%;height:100%;
  background:linear-gradient(90deg,var(--cyan),var(--blue));
  box-shadow:0 0 18px rgba(39,216,255,.6);transition:width .45s ease
}
.screen{display:none;min-height:650px;padding:clamp(28px,5vw,56px);animation:enter .45s ease}
.screen.active{display:block}
@keyframes enter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.eyebrow{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}
.category{display:inline-flex;align-items:center;gap:9px;color:var(--cyan2);font-size:12px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase}
.count{color:var(--dim);font-size:12px;font-weight:700}
h1,h2{font-family:"Syne",sans-serif}
h1{
  max-width:820px;margin:0 0 12px;font-size:clamp(40px,6vw,72px);
  line-height:.96;letter-spacing:-2.4px
}
h1 span,h2 span{color:var(--cyan);text-shadow:0 0 34px rgba(39,216,255,.35)}
.prompt{margin:0;color:var(--muted);font-size:clamp(17px,2vw,21px);line-height:1.55}
.instruction{margin-top:12px;color:var(--cyan2);font-size:13px;font-weight:700}
.answers{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:30px}
.answer{
  position:relative;min-height:134px;padding:18px;display:flex;flex-direction:column;
  justify-content:space-between;gap:18px;text-align:left;color:var(--text);cursor:pointer;
  border:1px solid rgba(255,255,255,.11);border-radius:20px;
  background:linear-gradient(180deg,rgba(255,255,255,.057),rgba(255,255,255,.023)),rgba(9,18,32,.82);
  box-shadow:0 10px 25px rgba(0,0,0,.14);transition:.22s ease
}
.answer:hover{transform:translateY(-3px);border-color:rgba(39,216,255,.35)}
.answer:active{transform:scale(.985)}
.answer.selected{
  border-color:rgba(39,216,255,.8);
  background:radial-gradient(circle at 10% 0%,rgba(39,216,255,.19),transparent 52%),rgba(12,31,49,.94);
  box-shadow:0 0 28px rgba(39,216,255,.18)
}
.icon{
  width:42px;height:42px;display:grid;place-items:center;border-radius:13px;
  background:rgba(39,216,255,.1);border:1px solid rgba(39,216,255,.19);font-size:21px
}
.label{font-size:15px;line-height:1.32;font-weight:700}
.check{
  position:absolute;top:14px;right:14px;width:25px;height:25px;border-radius:50%;
  display:grid;place-items:center;border:1px solid rgba(255,255,255,.16);
  color:transparent;background:rgba(255,255,255,.04);font-size:14px;font-weight:900
}
.answer.selected .check{
  color:#041018;background:var(--cyan);border-color:var(--cyan);
  box-shadow:0 0 18px rgba(39,216,255,.55)
}
.actions{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-top:28px}
.status{color:var(--muted);font-size:14px;font-weight:600}
.primary,.secondary{
  min-height:54px;padding:0 24px;border-radius:15px;font-family:"Syne",sans-serif;
  font-weight:800;cursor:pointer
}
.primary{
  border:0;color:#031018;background:linear-gradient(135deg,var(--cyan2),var(--cyan));
  box-shadow:0 14px 28px rgba(39,216,255,.18),0 0 24px rgba(39,216,255,.22)
}
.primary:disabled{opacity:.42;cursor:not-allowed;box-shadow:none}
.secondary{border:1px solid var(--border);color:var(--text);background:rgba(255,255,255,.035)}
.reveal{text-align:center}
.reveal-badge{
  width:92px;height:92px;margin:8px auto 24px;border-radius:50%;display:grid;place-items:center;
  border:1px solid rgba(34,197,94,.45);
  background:radial-gradient(circle at 36% 28%,rgba(134,239,172,.33),rgba(34,197,94,.12)),rgba(8,30,22,.9);
  color:#9bf6b6;font-size:42px;box-shadow:0 0 42px rgba(34,197,94,.22);animation:pop .55s ease
}
@keyframes pop{from{opacity:0;transform:scale(.45) rotate(-15deg)}to{opacity:1;transform:none}}
.reveal h2{
  margin:0 auto 12px;max-width:760px;font-size:clamp(36px,5vw,62px);
  line-height:1;letter-spacing:-1.8px
}
.reveal-copy{max-width:760px;margin:auto;color:var(--muted);font-size:18px;line-height:1.65}
.score-card{
  width:min(420px,100%);margin:28px auto 18px;padding:22px;border-radius:21px;
  border:1px solid rgba(39,216,255,.25);
  background:linear-gradient(135deg,rgba(39,216,255,.11),rgba(39,216,255,.025)),rgba(5,13,24,.7)
}
.score-label{color:var(--cyan2);font-size:11px;font-weight:800;letter-spacing:1.7px;text-transform:uppercase}
.score{margin-top:3px;font-family:"Syne",sans-serif;font-size:58px;line-height:1;font-weight:800}
.score span{color:var(--cyan)}
.note{max-width:760px;margin:16px auto 0;color:var(--dim);font-size:12px;line-height:1.55}
.reveal-actions{display:flex;justify-content:center;gap:12px;margin-top:26px;flex-wrap:wrap}
.final-card{
  max-width:760px;margin:24px auto 0;padding:24px;border-radius:22px;border:1px solid rgba(39,216,255,.24);
  background:linear-gradient(135deg,rgba(39,216,255,.10),rgba(39,216,255,.025)),rgba(5,13,24,.72)
}
.final-score{
  font-family:"Syne",sans-serif;font-size:clamp(56px,10vw,96px);font-weight:800;line-height:1;color:var(--cyan)
}
.final-tier{margin-top:8px;font-family:"Syne",sans-serif;font-size:24px;font-weight:800}
.final-copy{margin-top:12px;color:var(--muted);font-size:17px;line-height:1.6}
.spark{
  position:fixed;z-index:30;width:9px;height:9px;border-radius:2px;pointer-events:none;
  animation:confetti 900ms ease-out forwards
}
@keyframes confetti{to{opacity:0;transform:translate(var(--x),var(--y)) rotate(var(--r)) scale(.45)}}
.footer{padding:0 14px 18px;color:var(--dim);text-align:center;font-size:11px}
@media(max-width:820px){
  .screen{min-height:auto;padding:28px 20px 26px}
  .answers{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:540px){
  .round-pill{display:none}
  .brand-name{font-size:14px}
  .screen{padding:24px 14px 22px}
  .answers{gap:10px;margin-top:24px}
  .answer{min-height:126px;padding:15px;border-radius:17px}
  .label{font-size:13px}
  .actions{flex-direction:column;align-items:stretch}
  .status{text-align:center}
  .primary{width:100%}
  .reveal h2{font-size:38px}
  .reveal-copy{font-size:16px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
  <div class="brand">
    <div class="logo">BAI</div>
    <div>
      <div class="brand-name">Breakout AI Solutions</div>
      <div class="brand-sub">AI IQ Challenge</div>
    </div>
  </div>
  <div class="round-pill" id="roundPill">Round 1 of 6</div>
</header>

<main>
<section class="shell" aria-live="polite">
  <div class="progress"><span id="progressBar"></span></div>
  <div id="questionScreen" class="screen active"></div>
  <div id="revealScreen" class="screen reveal"></div>
  <div id="finalScreen" class="screen reveal"></div>
</section>
</main>

<div class="footer">Â© Breakout AI Solutions. AI IQ Challenge.</div>
</div>

<script>
const rounds = [
  {
    category:"Health & Wellness",
    icon:"fa-solid fa-heart-pulse",
    explanation:"AI can help you better organize health information, understand terminology, prepare questions, build healthy routines, and stay on top of everyday wellness tasks.",
    note:"AI is not a doctor. Always verify health information with a qualified medical professional.",
    answers:[
      ["fa-solid fa-stethoscope","Explain confusing medical information"],
      ["fa-solid fa-utensils","Suggest healthier meal ideas"],
      ["fa-solid fa-user-doctor","Prepare questions for doctor visits"],
      ["fa-solid fa-pills","Create medication reminder checklists"],
      ["fa-solid fa-person-walking","Build a walking or exercise routine"],
      ["fa-solid fa-book-medical","Compare trusted health information"]
    ]
  },
  {
    category:"Travel & Fun",
    icon:"fa-solid fa-plane",
    explanation:"AI can help organize nearly every part of a trip, from comparing options and building itineraries to finding activities, restaurants, and memorable stops.",
    answers:[
      ["fa-solid fa-hotel","Compare hotels and resorts"],
      ["fa-solid fa-plane-departure","Research flight options"],
      ["fa-solid fa-map-location-dot","Build a complete itinerary"],
      ["fa-solid fa-utensils","Find restaurants you may enjoy"],
      ["fa-solid fa-car-side","Plan scenic road trips"],
      ["fa-solid fa-golf-ball-tee","Create a golf or recreation getaway"]
    ]
  },
  {
    category:"Home & Everyday Life",
    icon:"fa-solid fa-house",
    explanation:"AI can simplify daily life by helping you compare choices, organize information, communicate clearly, plan meals, and tackle household projects.",
    answers:[
      ["fa-solid fa-cart-shopping","Compare products before buying"],
      ["fa-solid fa-envelope","Help write emails and messages"],
      ["fa-solid fa-file-invoice","Explain confusing bills or paperwork"],
      ["fa-solid fa-kitchen-set","Plan meals and grocery lists"],
      ["fa-solid fa-screwdriver-wrench","Help research home projects"],
      ["fa-solid fa-calendar-check","Organize schedules and appointments"]
    ]
  },
  {
    category:"Technology & Safety",
    icon:"fa-solid fa-shield-halved",
    explanation:"AI can make technology feel less frustrating by helping you understand devices, troubleshoot common problems, recognize suspicious activity, and learn new tools.",
    answers:[
      ["fa-solid fa-mobile-screen-button","Explain phone settings and features"],
      ["fa-solid fa-laptop","Troubleshoot computer problems"],
      ["fa-solid fa-shield-halved","Help recognize online scams"],
      ["fa-solid fa-lock","Organize safer password habits"],
      ["fa-solid fa-compass","Explain unfamiliar apps and websites"],
      ["fa-solid fa-print","Help solve printer and Wi-Fi issues"]
    ]
  },
  {
    category:"Pets, Family & Hobbies",
    icon:"fa-solid fa-paw",
    explanation:"AI can support the things you care about most, including pets, family memories, hobbies, events, learning, and creative projects.",
    answers:[
      ["fa-solid fa-dog","Research pet care and training ideas"],
      ["fa-solid fa-seedling","Help with gardening questions"],
      ["fa-solid fa-images","Organize family photos and memories"],
      ["fa-solid fa-tree","Research family history"],
      ["fa-solid fa-palette","Help explore a new hobby"],
      ["fa-solid fa-champagne-glasses","Plan family gatherings and events"]
    ]
  },
  {
    category:"Amazing Things AI Can Do",
    icon:"fa-solid fa-wand-magic-sparkles",
    explanation:"AI can do far more than answer questions. It can help restore memories, identify things around you, create personalized content, and organize projects that once felt overwhelming.",
    answers:[
      ["fa-solid fa-image","Restore or colorize old photos"],
      ["fa-solid fa-binoculars","Identify birds, plants, or objects"],
      ["fa-solid fa-book-open","Help organize a life story or memoir"],
      ["fa-solid fa-cake-candles","Create personalized celebration ideas"],
      ["fa-solid fa-language","Translate languages while traveling"],
      ["fa-solid fa-book","Turn family recipes into a cookbook"]
    ]
  }
];

let roundIndex = 0;
let selected = new Set();
let totalScore = 0;
const scores = [];

const questionScreen = document.getElementById("questionScreen");
const revealScreen = document.getElementById("revealScreen");
const finalScreen = document.getElementById("finalScreen");
const progressBar = document.getElementById("progressBar");
const roundPill = document.getElementById("roundPill");

function renderQuestion(){
  selected = new Set();
  const round = rounds[roundIndex];

  questionScreen.innerHTML = `
    <div class="eyebrow">
      <div class="category"><i class="${round.icon}" aria-hidden="true"></i><span>${round.category}</span></div>
      <div class="count">Question ${roundIndex + 1} of ${rounds.length}</div>
    </div>
    <h1>How <span>AI Smart</span> Are You?</h1>
    <p class="prompt">Which of these can AI help you with today?</p>
    <div class="instruction">Select every answer you believe is possible.</div>
    <div class="answers">
      ${round.answers.map((a,i)=>`
        <button class="answer" type="button" data-id="${i}">
          <span class="check">â</span>
          <span class="icon"><i class="${a[0]}" aria-hidden="true"></i></span>
          <span class="label">${a[1]}</span>
        </button>
      `).join("")}
    </div>
    <div class="actions">
      <div class="status" id="status">Choose one or more answers</div>
      <button id="checkScore" class="primary" type="button" disabled>Check My Score â</button>
    </div>
  `;

  questionScreen.classList.add("active");
  revealScreen.classList.remove("active");
  finalScreen.classList.remove("active");

  const answerButtons = [...document.querySelectorAll(".answer")];
  const status = document.getElementById("status");
  const checkScore = document.getElementById("checkScore");

  answerButtons.forEach(button=>{
    button.addEventListener("click",()=>{
      const id = button.dataset.id;
      if(selected.has(id)){
        selected.delete(id);
        button.classList.remove("selected");
      }else{
        selected.add(id);
        button.classList.add("selected");
        if("vibrate" in navigator) navigator.vibrate(12);
      }
      status.textContent = selected.size ? `${selected.size} of 6 selected` : "Choose one or more answers";
      checkScore.disabled = selected.size === 0;
    });
  });

  checkScore.addEventListener("click",showReveal);

  progressBar.style.width = `${((roundIndex + 1) / rounds.length) * 100}%`;
  roundPill.textContent = `Round ${roundIndex + 1} of ${rounds.length}`;
  window.scrollTo({top:0,behavior:"smooth"});
}

function showReveal(){
  const round = rounds[roundIndex];
  const roundScore = selected.size;
  scores[roundIndex] = roundScore;

  questionScreen.classList.remove("active");
  revealScreen.innerHTML = `
    <div class="reveal-badge">â</div>
    <h2>AI can help with <span>all six.</span></h2>
    <p class="reveal-copy">${round.explanation}</p>
    <div class="score-card">
      <div class="score-label">Your ${round.category.replace(/^.{0,3}\s/,"")} Score</div>
      <div class="score"><span id="scoreNumber">0</span> / 6</div>
    </div>
    ${round.note ? `<div class="note">${round.note}</div>` : ""}
    <div class="reveal-actions">
      <button id="retryButton" class="secondary" type="button">Try This Round Again</button>
      <button id="continueButton" class="primary" type="button">
        ${roundIndex < rounds.length - 1 ? "Continue â" : "See My Final Score â"}
      </button>
    </div>
  `;
  revealScreen.classList.add("active");
  animateScore(roundScore);
  launchConfetti();

  document.getElementById("retryButton").addEventListener("click",renderQuestion);
  document.getElementById("continueButton").addEventListener("click",()=>{
    if(roundIndex < rounds.length - 1){
      roundIndex += 1;
      renderQuestion();
    }else{
      showFinal();
    }
  });

  window.scrollTo({top:0,behavior:"smooth"});
}

function animateScore(target){
  const el = document.getElementById("scoreNumber");
  let current = 0;
  el.textContent = "0";
  if(target === 0) return;
  const timer = setInterval(()=>{
    current += 1;
    el.textContent = current;
    if(current >= target) clearInterval(timer);
  },115);
}

function launchConfetti(){
  const colors=["#27d8ff","#6ee7ff","#2776ff","#ff791f","#22c55e"];
  for(let i=0;i<46;i++){
    const spark=document.createElement("span");
    spark.className="spark";
    spark.style.left=`${window.innerWidth/2}px`;
    spark.style.top=`${Math.min(window.innerHeight*.32,260)}px`;
    spark.style.background=colors[i%colors.length];
    spark.style.setProperty("--x",`${(Math.random()-.5)*620}px`);
    spark.style.setProperty("--y",`${Math.random()*380+100}px`);
    spark.style.setProperty("--r",`${Math.random()*720-360}deg`);
    document.body.appendChild(spark);
    setTimeout(()=>spark.remove(),1100);
  }
}

function getTier(score){
  if(score <= 12) return "AI Beginner";
  if(score <= 22) return "AI Explorer";
  if(score <= 30) return "AI Power User";
  return "AI Expert";
}

function showFinal(){
  totalScore = scores.reduce((sum,n)=>sum+(n||0),0);
  const tier = getTier(totalScore);

  questionScreen.classList.remove("active");
  revealScreen.classList.remove("active");

  finalScreen.innerHTML = `
    <div class="reveal-badge"><i class="fa-solid fa-brain" aria-hidden="true"></i></div>
    <h2>Your <span>AI IQ</span> Score</h2>
    <p class="reveal-copy">You have now seen how many everyday tasks AI can support across health, travel, home, technology, family, hobbies, and more.</p>

    <div class="final-card">
      <div class="final-score">${totalScore} / 36</div>
      <div class="final-tier">${tier}</div>
      <div class="final-copy">
        Most people are surprised by how much AI can already do. The real opportunity is learning how to use it confidently, safely, and effectively in your own life.
      </div>
    </div>

    <div class="reveal-actions">
      <button id="restartQuiz" class="secondary" type="button">Take the Quiz Again</button>
      <button id="learnMore" class="primary" type="button">Get Personal Coaching â</button>
    </div>
  `;

  finalScreen.classList.add("active");
  progressBar.style.width = "100%";
  roundPill.textContent = "Complete";
  launchConfetti();

  document.getElementById("restartQuiz").addEventListener("click",()=>{
    roundIndex = 0;
    totalScore = 0;
    scores.length = 0;
    renderQuestion();
  });

  document.getElementById("learnMore").addEventListener("click",()=>{
    window.location.href = "https://breakoutaisolutions.com/coaching.html";
  });

  window.scrollTo({top:0,behavior:"smooth"});
}

renderQuestion();
</script>
</body>
</html>
